<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Hub | Sanctuary</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --border: #1e293b;
      --accent: #00f5d4;
      --accent2: #9b5de5;
      --text: #e2e8f0;
      --muted: #8b949e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 36px;
      background: rgba(9, 13, 22, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .layout {
      display: flex;
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 28px;
    }
    /* Subject Selector */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-title {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .subject-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .subject-btn:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .subject-btn.active {
      background: rgba(0, 245, 212, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .content-area {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .content-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: #fff;
    }
    .practice-btn {
      background: rgba(0, 245, 212, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .practice-btn:hover {
      background: var(--accent);
      color: #070b14;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .note-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 16px 20px;
      line-height: 1.6;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .unit-tag {
      font-size: 0.75rem;
      color: var(--accent2);
      font-weight: 600;
      margin-bottom: 6px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 820px) {
      .layout { flex-direction: column; padding: 16px; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/index.html" class="back-link">&larr; Back to Sanctuary</a>
    <span style="font-size:0.85rem; color:var(--muted)">Syllabus & Notes Portal</span>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Modules</div>
      <button class="subject-btn active" data-id="coa">Computer Org & Arch</button>
      <button class="subject-btn" data-id="dbms">DBMS</button>
      <button class="subject-btn" data-id="oops">OOPs (Java)</button>
      <button class="subject-btn" data-id="ads">Adv. Data Structures</button>
      <button class="subject-btn" data-id="stats">Prob. & Statistics</button>
    </aside>

    <main class="content-area">
      <div class="content-header">
        <h1 class="content-title" id="subjectHeading">Computer Organization & Architecture</h1>
        <a href="/Assimitype/AssimiType.html" class="practice-btn" id="practiceLink">Type Subject &rarr;</a>
      </div>
      <div class="notes-list" id="notesList"></div>
    </main>
  </div>

  <script>
    const DATA = {
      coa: {
        title: "Computer Organization and Architecture",
        notes: [
          { unit: "Unit I", text: "The basic functional units of a digital computer include the arithmetic logic unit, control unit, memory unit, and input-output unit." },
          { unit: "Unit I", text: "Computer registers are high-speed storage locations within the CPU used to hold intermediate data, memory addresses, and execution flags." },
          { unit: "Unit I", text: "The system bus structure consists of the data bus for bit transfer, address bus for location indexing, and control bus for sync coordination." },
          { unit: "Unit II", text: "Cache memory reduces average memory access time by storing recently accessed blocks closer to the CPU; direct, fully associative, and set-associative mappings are used." },
          { unit: "Unit III", text: "Direct Memory Access (DMA) allows peripherals to transfer contiguous blocks of data directly to/from memory without CPU intervention." }
        ]
      },
      dbms: {
        title: "Database Management System",
        notes: [
          { unit: "Unit I", text: "Three-level ANSI-SPARC architecture provides physical and logical data independence between internal storage schemas and external views." },
          { unit: "Unit I", text: "Relational algebra provides formal procedural query operations: select, project, union, set difference, Cartesian product, and natural joins." },
          { unit: "Unit II", text: "Normalization prevents data anomalies. 1NF enforces atomicity, 2NF removes partial dependencies, and 3NF/BCNF eliminate transitive functional dependencies." },
          { unit: "Unit III", text: "Transactions must strictly satisfy ACID properties: Atomicity, Consistency, Isolation, and Durability." },
          { unit: "Unit III", text: "Two-Phase Locking (2PL) ensures serializability by dividing lock requests into growing and shrinking phases." }
        ]
      },
      oops: {
        title: "Object Oriented Programming with Java",
        notes: [
          { unit: "Unit 1", text: "OOP in Java revolves around the core pillars of encapsulation, inheritance, polymorphism, and abstraction." },
          { unit: "Unit 1", text: "The JVM interprets compiled bytecode (.class), delivering write-once, run-anywhere platform portability." },
          { unit: "Unit 2", text: "Java IO utilizes Stream abstractions; Byte Streams handle binary files while Character Streams handle Unicode textual content." },
          { unit: "Unit 2", text: "Multithreading enables concurrent execution via extending Thread or implementing Runnable; monitors and synchronized protect critical sections." },
          { unit: "Unit 3", text: "JDBC provides unified connectivity using DriverManager, Connection, PreparedStatement, and ResultSet." }
        ]
      },
      ads: {
        title: "Advanced Data Structures",
        notes: [
          { unit: "Unit 1", text: "Asymptotic notations (Big-O, Theta, Omega) describe growth boundaries for worst, tight, and lower execution costs." },
          { unit: "Unit 1", text: "The Master Method solves divide-and-conquer recurrences of form T(n) = aT(n/b) + f(n)." },
          { unit: "Unit 2", text: "Binary Search Trees enforce left-child < root < right-child; AVL and Red-Black Trees maintain balance factors to guarantee O(log n) lookups." },
          { unit: "Unit 3", text: "Dijkstra's greedy algorithm finds single-source shortest paths in graphs with non-negative edge weights." }
        ]
      },
      stats: {
        title: "Probability and Statistics",
        notes: [
          { unit: "Unit 1", text: "Measures of central tendency (mean, median, mode) and dispersion (standard deviation, variance) quantify sample distributions." },
          { unit: "Unit 1", text: "Bayes' Rule updates the posterior probability of a hypothesis given prior odds and conditional likelihood." },
          { unit: "Unit 2", text: "Method of Least Squares computes optimal regression coefficients by minimizing the sum of squared vertical residuals." },
          { unit: "Unit 3", text: "Small-sample hypothesis testing utilizes Student's t-distribution when population variance is unknown." }
        ]
      }
    };

    const buttons = document.querySelectorAll('.subject-btn');
    const heading = document.getElementById('subjectHeading');
    const notesList = document.getElementById('notesList');
    const practiceLink = document.getElementById('practiceLink');

    function renderSubject(key) {
      const sub = DATA[key] || DATA.coa;
      heading.textContent = sub.title;
      notesList.innerHTML = sub.notes.map(n => `
        <div class="note-card">
          <span class="unit-tag">${n.unit}</span>
          <p>${n.text}</p>
        </div>
      `).join('');
      buttons.forEach(b => b.classList.toggle('active', b.dataset.id === key));
    }

    buttons.forEach(b => {
      b.addEventListener('click', () => renderSubject(b.dataset.id));
    });

    // Check query params (?subject=...)
    const params = new URLSearchParams(window.location.search);
    const subParam = params.get('subject') || params.get('q');
    if (subParam && DATA[subParam]) {
      renderSubject(subParam);
    } else {
      renderSubject('coa');
    }
  </script>
</body>
</html>
